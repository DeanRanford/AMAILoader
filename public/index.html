<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMAI Web Patcher - Warcraft III</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #1e1e1e;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        width: 400px;
      }
      h2 {
        margin-top: 0;
        color: #bb86fc;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }
      select,
      input[type="file"] {
        width: 100%;
        padding: 8px;
        background: #2d2d2d;
        border: 1px solid #444;
        color: #fff;
        border-radius: 4px;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .checkbox-group input {
        accent-color: #bb86fc;
      }
      .checkbox-group label {
        margin: 0;
      }
      button {
        width: 100%;
        background: #bb86fc;
        color: #121212;
        border: none;
        padding: 10px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #9a67ea;
      }
      #loading {
        display: none;
        text-align: center;
        margin-top: 15px;
        color: #03dac6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>AMAI Map Patcher</h2>
      <form
        id="patchForm"
        action="/process-map"
        method="POST"
        enctype="multipart/form-data"
      >
        <div class="form-group">
          <label for="mapFiles">
            Select one or more Warcraft III maps (.w3m / .w3x):
          </label>
          <input
            type="file"
            id="mapFiles"
            name="mapFiles"
            accept=".w3m,.w3x"
            multiple
            required
          />
        </div>

        <div class="form-group">
          <label for="version">
            Warcraft III Version / Tech Tree (Optimized Scripts):
          </label>
          <select id="version" name="version">
            <option value="REFORGED">Reforged (v3.0.0+)</option>
            <option value="TFT">The Frozen Throne (v1.24 - v1.28)</option>
            <option value="ROC">Reign of Chaos (v1.24 - v1.28)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="commander">Game Mode / Commander Option:</label>
          <select id="commander" name="commander">
            <option value="1">With Commander (Enabled)</option>
            <option value="0">No Commander</option>
            <option value="2">
              VS Vanilla AI (Odd teams AMAI, Even teams Blizzard)
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="language">AI Chat Language:</label>
          <select id="language" name="language">
            <option value="English" selected>English</option>
            <option value="Chinese">Chinese</option>
            <option value="Deutsch">Deutsch</option>
            <option value="French">French</option>
            <option value="Norwegian">Norwegian</option>
            <option value="Portuguese">Portuguese</option>
            <option value="Romanian">Romanian</option>
            <option value="Russian">Russian</option>
            <option value="Spanish">Spanish</option>
            <option value="Swedish">Swedish</option>
          </select>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="forceLanguage" name="forceLanguage" value="true" />
          <label for="forceLanguage">Force AI chat language</label>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="disableChat" name="disableChat" value="true" />
          <label for="disableChat">Disable AI bot chatter</label>
        </div>

        <button type="submit" id="submitBtn">
          Install AMAI & Download
        </button>
      </form>
      <div id="loading">
        Processing map(s) via Wine/AMAI... Please wait. Multiple maps download
        as a ZIP file.
      </div>
    </div>

    <script>
      const form = document.getElementById("patchForm");
      const loading = document.getElementById("loading");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", () => {
        submitBtn.style.display = "none";
        loading.style.display = "block";
      });
    </script>
  </body>
</html>
